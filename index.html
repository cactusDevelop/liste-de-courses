<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liste de courses</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-bar">
        <h1>Liste de courses</h1>
        <button id="edit-btn" class="icon-btn edit-btn" type="button" title="Modifier la liste" aria-label="Modifier la liste" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
        </button>
    </header>

    <div id="store-sections"></div>

    <div id="edit-bar" class="edit-bar" hidden>
        <span id="edit-status" class="edit-status"></span>
        <button id="cancel-btn" type="button">Annuler</button>
        <button id="save-btn" type="button" class="primary">Enregistrer</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
