<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liste de courses</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .item-text {
            font-size: 18px;
        }

        .checked .item-text {
            text-decoration: line-through;
            color: #888;
        }

        #checked-list li {
            background: #e5e5e5;
        }

        .empty {
            color: #888;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Liste de courses</h1>

    <h2>À acheter</h2>
    <ul id="todo-list"></ul>

    <h2>Acheté</h2>
    <ul id="checked-list"></ul>

    <script src="script.js"></script>

</body>
</html>
