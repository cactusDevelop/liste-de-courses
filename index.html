<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liste de courses</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 0 15px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        /* Section du magasin */
        details {
            background: white;
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
        }

        summary {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            user-select: none;
        }

        summary:hover {
            background: #eeeeee;
        }

        /* Liste des produits */
        ul {
            list-style: none;
            padding: 0 15px 15px 15px;
            margin: 0;
        }

        li {
            background: #f5f5f5;
            padding: 12px;
            margin: 7px 0;
            border-radius: 7px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .item-text {
            font-size: 18px;
        }

        .checked .item-text {
            text-decoration: line-through;
            color: #888;
        }

        .empty {
            color: #888;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Liste de courses</h1>

    <div id="store-sections"></div>

    <script src="script.js"></script>

</body>
</html>
